<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DUCO Miner Dashboard</title>
<style>
    body {
        font-family: monospace;
        background-color: #111;
        color: #eee;
        padding: 20px;
    }

    h1 {
        color: #c77dff;
    }

    input, button {
        padding: 8px;
        font-size: 14px;
        background: #222;
        color: #eee;
        border: 1px solid #555;
    }

    button {
        cursor: pointer;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 15px;
    }

    th, td {
        border: 2px solid #444;
        padding: 6px;
        text-align: center;
    }

    th {
        background-color: #222;
    }

    .green { color: #4CAF50; }
    .red { color: #ff4c4c; }
    .blue { color: #4da6ff; }
    .orange { color: #ff9933; }
    .cyan { color: #00e5ff; }
    .purple { color: #c77dff; }
    .yellow { color: #ffeb3b; }

    #refresh {
        margin-top: 10px;
        font-size: 14px;
    }

    .tx-box {
        font-size: 0.85em;
        text-align: left;
        padding: 5px;
        
    }
</style>
</head>
<body>

<h1>DUCO Miner Dashboard</h1>

<label>DUCO Username:</label>
<input type="text" id="username" placeholder="my_cool_adis">
<button onclick="start()">Start</button>

<div id="summary"></div>
<div id="miners"></div>
<div id="refresh"></div>

<script>
let prevBalance = 0
let first = true
let refreshTimer = null
let startTime = Date.now()
let initialBalance = 0

function formatHashrate(hr) {
    let unit = "H"
    if (hr >= 1000000) {
        hr /= 1000000
        unit = "mH"
    } else if (hr >= 1000) {
        hr /= 1000
        unit = "kH"
    }
    return hr.toFixed(2) + " " + unit + "/s"
}

function sec2hms(sec) {
    let h = Math.floor(sec / 3600).toString().padStart(2, '0')
    let m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0')
    let s = Math.floor(sec % 60).toString().padStart(2, '0')
    return `${h}:${m}:${s}`
}
async function fetchData() {
    const username = document.getElementById("username").value
    if (!username) return

    try {
        const response = await fetch(`https://server.duinocoin.com/v2/users/${username}`)
        const data = await response.json()

        const result = data.result
        const miners = result.miners
        const balance = result.balance.balance
        const verified = result.balance.verified
        const trustScore = result.balance.trust_score
        
		// Accesează ULTIMUL element din array (cea mai recentă tranzacție)
		const lastTx = (result.transactions && result.transactions.length > 0) 
			? result.transactions[result.transactions.length - 1] 
			: null;

		let txHTML = "N/A";
		if (lastTx) {
			const isSender = lastTx.sender === username;
			const party = isSender ? `To: ${lastTx.recipient}` : `From: ${lastTx.sender}`;
			const colorClass = isSender ? "red" : "green";
			const sign = isSender ? "-" : "+";
    
			txHTML = `<div class="tx-box">
				<span class="${colorClass}">${sign}${lastTx.amount} DUCO</span><br>
				<small>${party}</small><br>
				<small class="orange">"${lastTx.datetime}"</small>
			</div>`;
		}

        // --- EXTRAGERE PRET ---
        // API-ul Duino oferă prețul estimat în result.prices.duco_price
        const ducoPrice = (result.prices && result.prices.duco_price) ? result.prices.duco_price : 0.0000643;
        const balanceNum = parseFloat(balance) || 0;
        const balanceUSD = (balanceNum * ducoPrice).toFixed(6);
        // ----------------------

        let totalHash = 0
        let totalAccepted = 0
        let totalSharerate = 0

        const secondsElapsed = (Date.now() - startTime) / 1000
		let daily_average = 0
		if (secondsElapsed > 60) {
			const balanceGained = balance - initialBalance
			daily_average = (balanceGained / secondsElapsed) * 86400
		} else {
			daily_average = result.balance.daily_estimate || 0
		}

        let tableHTML = `
        <table>
            <tr>
                <th>ID</th>
                <th>Software</th>
                <th>Algo</th>
                <th>Success</th>
                <th>Rejected</th>
                <th>Hashrate</th>
                <th>Pool</th>
                <th>Diff</th>
                <th>Ping</th>
            </tr>
        `

        miners.forEach(m => {
            const hashrate = parseInt(m.hashrate || 0)
            const accepted = parseInt(m.accepted || 0)
            const rejected = parseInt(m.rejected || 0)
            let sharerate = parseInt(m.sharetime || 0)

            if (sharerate < accepted + rejected) {
                sharerate = accepted + rejected
            }

            totalHash += hashrate
            totalAccepted += accepted
            totalSharerate += sharerate

            const ping = parseInt(m.pg || 0)
            const pingClass = ping <= 40 ? "green" : "red"
            const rejectedClass = rejected > 0 ? "red" : "green"

            tableHTML += `
            <tr>
                <td class="blue">${m.identifier}</td>
                <td class="orange">${m.software}</td>
                <td>${m.algorithm}</td>
                <td class="green">${accepted}/${sharerate}</td>
                <td class="${rejectedClass}">${rejected}</td>
                <td class="cyan">${formatHashrate(hashrate)}</td>
                <td>${m.pool}</td>
                <td>${m.diff}</td>
                <td class="${pingClass}">${ping}</td>
            </tr>
            `
        })

        tableHTML += "</table>"

        const successPc = totalSharerate > 0
            ? Math.floor((totalAccepted / totalSharerate) * 100)
            : 0

        const uptime = sec2hms(secondsElapsed)
        const verifiedClass = verified === "yes" ? "green" : "red"

        if (first) {
            initialBalance = balance
            first = false
        }
        prevBalance = balance

        document.getElementById("summary").innerHTML = `
        <table>
            <tr>
                <th>Username</th>
                <th>Balance</th>
                <th>Daily Avg</th>
                <th>Miners</th>
                <th>Total Hashrate</th>
                <th>Uptime</th>
                <th>Verified</th>
                <th>Last Transaction</th>
            </tr>
            <tr>
                <td class="purple">${username}</td>
                <td class="green">
                    ${balance.toFixed(4)} DUCO<br>
                    <small class="yellow">$${balanceUSD}</small>
                </td>
                <td class="green">${daily_average.toFixed(2)} DUCO</td>
                <td>${miners.length}</td>
                <td class="cyan">${formatHashrate(totalHash)}</td>
                <td>${uptime}</td>
                <td class="${verifiedClass}">
                    ${verified} (Trust: ${trustScore})
                </td>
                <td>${txHTML}</td>
            </tr>
        </table>
        `

        document.getElementById("miners").innerHTML = tableHTML
        startCountdown()

    } catch (err) {
        document.getElementById("miners").innerHTML =
            `<p class="red">Error fetching data</p>`
        console.error(err)
    }
}

function startCountdown() {
    let seconds = 60
    clearInterval(refreshTimer)

    refreshTimer = setInterval(() => {
        const color = seconds <= 5 ? "red" : "green"
        document.getElementById("refresh").innerHTML =
            `<span class="${color}">Refreshing in ${seconds}s...</span>`

        seconds--
        if (seconds < 0) {
            clearInterval(refreshTimer)
            fetchData()
        }
    }, 1000)
}

function start() {
    startTime = Date.now()
    first = true
    fetchData()
}
</script>

</body>
</html>
