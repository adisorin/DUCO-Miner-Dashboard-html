<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DUCO Miner Dashboard</title>
<style>
    body {
        font-family: monospace;
        background-color: #111;
        color: #eee;
        padding: 20px;
    }

    h1 {
        color: #c77dff;
    }

    input, button {
        padding: 8px;
        font-size: 14px;
        background: #222;
        color: #00FF00;
        border: 1px solid #555;
    }

    button {
        cursor: pointer;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 15px;
    }

    th, td {
        border: 2px solid #444;
        padding: 6px;
        text-align: center;
    }

    th {
        background-color: #222;
    }

    .green { color: #4CAF50; }
    .red { color: #ff4c4c; }
    .blue { color: #4da6ff; }
    .orange { color: #ff9933; }
    .cyan { color: #00e5ff; }
    .purple { color: #c77dff; }
    .yellow { color: #ffeb3b; }

    #refresh {
        margin-top: 10px;
        font-size: 14px;
    }

    .tx-box {
        font-size: 0.85em;
        text-align: left;
        padding: 5px;
    }


    /* === EFECT PULSE === */
    .pulse {
		margin-left: 140px;
    	animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { text-shadow: 0 0 5px rgba(56,189,248,0.8); opacity: 1; }
      50% { text-shadow: 0 0 20px rgba(56,189,248,1); opacity: 0.7; }
      100% { text-shadow: 0 0 5px rgba(56,189,248,0.8); opacity: 1; }
    }
	
    /* --- STIL BUSTIERA STIRI (TICKER) --- */
    .ticker-wrap {
        display: none; /* Va fi setat la 'flex' din JS */
        position: relative; /* Necesar pentru a ancora textul fix */
        width: 100%;
        overflow: hidden;
        background: #181818;
        border: 2px solid #444;
        height: 40px;
        margin: 15px 0;
        align-items: center;
    }

    /* Textul fix din fundal */
    .ticker-bg-text {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.1); /* Culoare discretă, tip info */
        font-weight: bold;
        font-family: sans-serif;
        text-transform: uppercase;
        letter-spacing: 2px;
        pointer-events: none; /* Să nu încurce la click-uri */
        z-index: 0;
    }

    .ticker-move {
        display: inline-block;
        white-space: nowrap;
        padding-left: 100%;
        animation: ticker-animation 60s linear infinite;
        z-index: 1; /* Peste textul din fundal */
        position: relative;
    }


    .price-item-inline {
        display: inline-block;
        padding: 0 25px;
        font-size: 1em;
    }

    .price-item-inline span {
        color: #ffeb3b;
        font-weight: bold;
    }

    @keyframes ticker-animation {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }
	
	.start-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
	}

	.quick-links a img {
		width: 32px;
		height: 32px;
		margin-left: 6px;
		filter: invert(1);
		opacity: 0.85;
		transition: transform 0.2s, opacity 0.2s;
	}

	.quick-links a img:hover {
		transform: scale(1.15);
		opacity: 1;
	}

</style>
</head>
<body>

<h1>DUCO Miner Dashboard</h1>

<label>DUCO Username:</label>

<div class="start-row">
    <input type="text" id="username" placeholder="my_cool_adis">
    <button onclick="start()">Start</button>
	<div class="mt-2 pulse">
	  
        <a href="https://www.facebook.com/groups/454273464099316" target="_blank" title="Facebook">
		<img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" 
		alt="Facebook" width="32" height="32">
        </a>
		
        <a href="https://github.com/adisorin?tab=projects" target="_blank" title="GitHub">
		<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" 
		alt="GitHub" width="32" height="32" style="filter:invert(1); opacity:0.8; margin-left:10px;">
        </a>
		
		<a href="https://explorer.duinocoin.com/" target="_blank" title="Live Duino network statistics">
		<img src="https://github.com/duino-coin/duino-coin/blob/master/Resources/Node.png?raw=true" 
		alt="Live Duino network statistics" width="36" height="36" style="filter:invert(1); opacity:0.8; margin-left:10px;">
        </a>
		
		<a href="https://siunus.github.io/duco-monitor/v2023/" target="_blank" title="siunus.github.io">
		<img src="https://github.com/duino-coin/duino-coin/blob/master/Resources/WebMiner.png?raw=true" 
		alt="siunus.github.io" width="36" height="36" style="filter:invert(1); opacity:0.8; margin-left:10px;">
        </a>
		
		<a href="https://duco-faucet.pcgeek.pl/" target="_blank" title="Duino Coin Faucet - AMOGUS">
		<img src="https://duco-faucet.pcgeek.pl/assets/img/amogus.png" 
		alt="siunus.github.io" width="36" height="36" style="filter:invert(1); opacity:0.8; margin-left:10px;">
        </a>
		
		<a href="https://wizardcat.space/" target="_blank" title="WizardCat-Faucet">
		<img src="https://wizardcat.space/images/cat1.png" 
		alt="siunus.github.io" width="36" height="36" style="filter:invert(1); opacity:0.8; margin-left:10px;">
        </a>
		
		<a href="https://www.livecoinwatch.com/price/DuinoCoin-DUCO" target="_blank" title="DuinoCoin-DUCO-price">
		<img src="https://lcw.nyc3.cdn.digitaloceanspaces.com/production/currencies/64/duco.png" 
		alt="siunus.github.io" width="36" height="36" style="filter:invert(1); opacity:0.8; margin-left:10px;">
        </a>
		
	</div>
</div>


<div id="summary"></div>

<!-- Bustiera de preturi -->
<div class="ticker-wrap" id="ticker-container">
    <div class="ticker-bg-text">REFERENCE VIRTUAL CURRENCIES FOR DUCO COIN TO DOLLARS IN REAL-TIME</div>
    <div id="exchange-prices" class="ticker-move"></div> 
</div>


<div id="miners"></div>
<div id="refresh"></div>

<script>
let prevBalance = 0
let first = true
let refreshTimer = null
let startTime = Date.now()
let initialBalance = 0

function formatHashrate(hr) {
    let unit = "H"
    if (hr >= 1000000) {
        hr /= 1000000
        unit = "mH"
    } else if (hr >= 1000) {
        hr /= 1000
        unit = "kH"
    }
    return hr.toFixed(2) + " " + unit + "/s"
}

function sec2hms(sec) {
    let h = Math.floor(sec / 3600).toString().padStart(2, '0')
    let m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0')
    let s = Math.floor(sec % 60).toString().padStart(2, '0')
    return `${h}:${m}:${s}`
}

async function fetchData() {
    const username = document.getElementById("username").value
    if (!username) return

    try {
        const response = await fetch(`https://server.duinocoin.com/v2/users/${username}`)
        const data = await response.json()

        const result = data.result
        const miners = result.miners
        const balance = result.balance.balance
        const verified = result.balance.verified
        const trustScore = result.balance.trust_score
        
		// --- PRETURI DIN API DUINO-COIN ---
		const prices = result.prices || {};

        
		const lastTx = (result.transactions && result.transactions.length > 0) 
			? result.transactions[result.transactions.length - 1] 
			: null;

		let txHTML = "N/A";
		if (lastTx) {
			const isSender = lastTx.sender === username;
			const party = isSender ? `To: ${lastTx.recipient}` : `From: ${lastTx.sender}`;
			const colorClass = isSender ? "red" : "green";
			const sign = isSender ? "-" : "+";
    
			txHTML = `<div class="tx-box">
				<span class="${colorClass}">${sign}${lastTx.amount} DUCO</span><br>
				<small>${party}</small><br>
				<small class="orange">"${lastTx.datetime}"</small>
			</div>`;
		}

		// --- PRET DUCO DIN API (MAX) ---
		const ducoPrice = parseFloat(prices.max || 0);
		const balanceUSD = ducoPrice > 0
			? (balance * ducoPrice).toFixed(6)
			: "0.000000";



        // --- AFISARE PRETURI IN BUSTIERA (TICKER) ---
        let pricesHTML = "";
		for (const [key, val] of Object.entries(prices)) {
			const price = parseFloat(val);
			if (price > 0) {
				pricesHTML += `<div class="price-item-inline">
					${key}: <span>$${price.toFixed(8)}</span>
				</div>`;
			}
		}

        // Repetam continutul pentru a evita spatiul gol mare la finalul animatiei
        document.getElementById("exchange-prices").innerHTML = pricesHTML;

        let totalHash = 0
        let totalAccepted = 0
        let totalSharerate = 0

        const secondsElapsed = (Date.now() - startTime) / 1000
		let daily_average = 0
		if (secondsElapsed > 60) {
			const balanceGained = balance - initialBalance
			daily_average = (balanceGained / secondsElapsed) * 86400
		} else {
			daily_average = result.balance.daily_estimate || 0
		}

        let tableHTML = `<table><tr><th>Device ID</th>
		<th>Software</th>
		<th>Algo</th>
		<th>Success</th>
		<th>Rejected</th>
		<th>Hashrate</th>
		<th>Pool</th>
		<th>Diff</th>
		<th>Ping</th></tr>`

        miners.forEach(m => {
            const hashrate = parseInt(m.hashrate || 0);
            const accepted = parseInt(m.accepted || 0);
            const rejected = parseInt(m.rejected || 0);
            let sharerate = parseInt(m.sharetime || 0);
			
            if (sharerate < accepted + rejected) {
                sharerate = accepted + rejected
            }

            totalHash += hashrate;
            totalAccepted += accepted;
            totalSharerate += sharerate;

            tableHTML += `<tr><td class="blue">${m.identifier}</td>
			<td class="orange">${m.software}</td>
			<td>${m.algorithm}</td>
			<td class="green">${accepted}/${sharerate}</td>
			<td class="${rejected > 0 ? 'red' : 'green'}">${rejected}</td>
			<td class="cyan">${formatHashrate(hashrate)}</td>
			<td>${m.pool}</td>
			<td>${m.diff}</td>
			<td class="${parseInt(m.pg||0) <= 40 ? 'green' : 'red'}">${m.pg||0}</td>
			</tr>`
        })
        tableHTML += "</table>"

        if (first) { initialBalance = balance; first = false; }

        document.getElementById("summary").innerHTML = `
        <table>
            <tr>
			<th>Username</th>
			<th>Balance</th>
			<th>Daily Avg</th>
			<th>Miners</th>
			<th>Total Hashrate</th>
			<th>Uptime</th>
			<th>Verified</th>
			<th>Last Transaction</th>
			</tr>
			
            <tr>
            <td class="purple">${username}</td>
            <td class="green">${balance.toFixed(4)} DUCO<br><small class="yellow">$${balanceUSD}</small></td>
            <td class="green">${daily_average.toFixed(2)} DUCO</td>
            <td>${miners.length}</td>
            <td class="cyan">${formatHashrate(totalHash)}</td>
            <td>${sec2hms(secondsElapsed)}</td>
            <td class="${verified === 'yes' ? 'green' : 'red'}">${verified} (Trust: ${trustScore})</td>
			<td>${txHTML}</td>
            </tr>
			
        </table>`;

        document.getElementById("miners").innerHTML = tableHTML;
        startCountdown();

    } catch (err) {
        document.getElementById("miners").innerHTML =
            `<p class="red">Error fetching data</p>`
        console.error(err)
    }
}

function startCountdown() {
    let seconds = 60; 
    clearInterval(refreshTimer);

    refreshTimer = setInterval(() => {
        const color = seconds <= 5 ? "red" : "green";
        document.getElementById("refresh").innerHTML =
            `<span class="${color}">Refreshing in ${seconds}s...</span>`;

        seconds--;
        if (seconds < 0) {
            clearInterval(refreshTimer);
            fetchData();
        }
    }, 1000);
}

function start() {
    

    // Afișează bustiera
    document.querySelector(".ticker-wrap").style.display = "flex";
    
    startTime = Date.now();
    first = true;
    fetchData();
}

</script>

</body>
</html>
