<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DUCO Miner Dashboard</title>
<style>
    body {
        font-family: monospace;
        background-color: #111;
        color: #eee;
        padding: 20px;
    }

    h1 {
        color: #c77dff;
    }

    input, button {
        padding: 8px;
        font-size: 14px;
        background: #222;
        color: #eee;
        border: 1px solid #555;
    }

    button {
        cursor: pointer;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 15px;
    }

    th, td {
        border: 1px solid #444;
        padding: 6px;
        text-align: center;
    }

    th {
        background-color: #222;
    }

    .green { color: #4CAF50; }
    .red { color: #ff4c4c; }
    .blue { color: #4da6ff; }
    .orange { color: #ff9933; }
    .cyan { color: #00e5ff; }
    .purple { color: #c77dff; }

    #refresh {
        margin-top: 10px;
        font-size: 14px;
    }
</style>
</head>
<body>

<h1>DUCO Miner Dashboard</h1>

<label>DUCO Username:</label>
<input type="text" id="username" placeholder="username here">
<button onclick="start()">Start</button>

<div id="summary"></div>
<div id="miners"></div>
<div id="refresh"></div>

<script>
let prevBalance = 0
let first = true
let refreshTimer = null
let startTime = Date.now()

function formatHashrate(hr) {
    let unit = "H"
    if (hr >= 1000000) {
        hr /= 1000000
        unit = "mH"
    } else if (hr >= 1000) {
        hr /= 1000
        unit = "kH"
    }
    return hr.toFixed(2) + " " + unit + "/s"
}

function sec2hms(sec) {
    let h = Math.floor(sec / 3600).toString().padStart(2, '0')
    let m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0')
    let s = Math.floor(sec % 60).toString().padStart(2, '0')
    return `${h}:${m}:${s}`
}

async function fetchData() {
    const username = document.getElementById("username").value
    if (!username) return

    try {
        const response = await fetch(`https://server.duinocoin.com/v2/users/${username}`)
        const data = await response.json()

        const result = data.result
        const miners = result.miners
        const balance = result.balance.balance
        const verified = result.balance.verified
        const trustScore = result.balance.trust_score

        let totalHash = 0
        let totalAccepted = 0
        let totalSharerate = 0

        let tableHTML = `
        <table>
            <tr>
                <th>ID</th>
                <th>Software</th>
                <th>Algo</th>
                <th>Success</th>
                <th>Rejected</th>
                <th>Hashrate</th>
                <th>Pool</th>
                <th>Diff</th>
                <th>Ping</th>
            </tr>
        `

        miners.forEach(m => {
            const hashrate = parseInt(m.hashrate || 0)
            const accepted = parseInt(m.accepted || 0)
            const rejected = parseInt(m.rejected || 0)
            let sharerate = parseInt(m.sharetime || 0)

            if (sharerate < accepted + rejected) {
                sharerate = accepted + rejected
            }

            totalHash += hashrate
            totalAccepted += accepted
            totalSharerate += sharerate

            const ping = parseInt(m.pg || 0)
            const pingClass = ping <= 40 ? "green" : "red"
            const rejectedClass = rejected > 0 ? "red" : "green"

            tableHTML += `
            <tr>
                <td class="blue">${m.identifier}</td>
                <td class="orange">${m.software}</td>
                <td>${m.algorithm}</td>
                <td class="green">${accepted}/${sharerate}</td>
                <td class="${rejectedClass}">${rejected}</td>
                <td class="cyan">${formatHashrate(hashrate)}</td>
                <td>${m.pool}</td>
                <td>${m.diff}</td>
                <td class="${pingClass}">${ping}</td>
            </tr>
            `
        })

        tableHTML += "</table>"

        const successPc = totalSharerate > 0
            ? Math.floor((totalAccepted / totalSharerate) * 100)
            : 0

        const uptime = sec2hms((Date.now() - startTime) / 1000)

        const verifiedClass = verified === "yes" ? "green" : "red"

        let balanceDiff = 0
        if (!first) {
            balanceDiff = (balance - prevBalance).toFixed(6)
        }
        first = false
        prevBalance = balance

        document.getElementById("summary").innerHTML = `
        <table>
            <tr>
                <th>Username</th>
                <th>Balance</th>
                <th>Miners</th>
                <th>Total Hashrate</th>
                <th>Total Success</th>
                <th>Uptime</th>
                <th>Verified</th>
            </tr>
            <tr>
                <td class="purple">${username}</td>
                <td class="green">${balance}</td>
                <td>${miners.length}</td>
                <td class="cyan">${formatHashrate(totalHash)}</td>
                <td>${successPc}% (${totalAccepted}/${totalSharerate})</td>
                <td>${uptime}</td>
                <td class="${verifiedClass}">
                    ${verified} (Trust: ${trustScore})
                </td>
            </tr>
        </table>
        `

        document.getElementById("miners").innerHTML = tableHTML

        startCountdown()

    } catch (err) {
        document.getElementById("miners").innerHTML =
            `<p class="red">Error fetching data</p>`
        console.error(err)
    }
}

function startCountdown() {
    let seconds = 60
    clearInterval(refreshTimer)

    refreshTimer = setInterval(() => {
        const color = seconds <= 5 ? "red" : "green"
        document.getElementById("refresh").innerHTML =
            `<span class="${color}">Refreshing in ${seconds}s...</span>`

        seconds--
        if (seconds < 0) {
            clearInterval(refreshTimer)
            fetchData()
        }
    }, 1000)
}

function start() {
    startTime = Date.now()
    fetchData()
}
</script>

</body>
</html>
