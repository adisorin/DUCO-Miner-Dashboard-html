<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DUCO Miner Dashboard</title>
<style>
    body {
        font-family: monospace;
        background-color: #111;
        color: #eee;
        padding: 20px;
    }

    h1 {
        color: #c77dff;
    }

    input, button {
        padding: 8px;
        font-size: 14px;
        background: #222;
        color: #eee;
        border: 1px solid #555;
    }

    button {
        cursor: pointer;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 15px;
    }

    th, td {
        border: 2px solid #444;
        padding: 6px;
        text-align: center;
    }

    th {
        background-color: #222;
    }

    .green { color: #4CAF50; }
    .red { color: #ff4c4c; }
    .blue { color: #4da6ff; }
    .orange { color: #ff9933; }
    .cyan { color: #00e5ff; }
    .purple { color: #c77dff; }
    .yellow { color: #ffeb3b; }

    #refresh {
        margin-top: 10px;
        font-size: 14px;
    }

    .tx-box {
        font-size: 0.85em;
        text-align: left;
        padding: 5px;
    }

    /* --- STIL BUSTIERA STIRI (TICKER) --- */
    .ticker-wrap {
        display: none; /* Ascuns implicit */
        width: 100%;
        overflow: hidden;
        background: #181818;
        border: 2px solid #444;
        height: 40px;
        margin: 15px 0;
        align-items: center;
    }


    .ticker-move {
        display: inline-block;
        white-space: nowrap;
        padding-left: 100%; /* Incepe din afara ecranului dreapta */
        animation: ticker-animation 60s linear infinite;
    }

    .price-item-inline {
        display: inline-block;
        padding: 0 25px;
        font-size: 1em;
    }

    .price-item-inline span {
        color: #ffeb3b;
        font-weight: bold;
    }

    @keyframes ticker-animation {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }
</style>
</head>
<body>

<h1>DUCO Miner Dashboard</h1>

<label>DUCO Username:</label>
<input type="text" id="username" placeholder="my_cool_adis">
<button onclick="start()">Start</button>

<div id="summary"></div>

<!-- Bustiera de preturi -->
<div class="ticker-wrap">
    <div id="exchange-prices" class="ticker-move"></div> 
</div>

<div id="miners"></div>
<div id="refresh"></div>

<script>
let prevBalance = 0
let first = true
let refreshTimer = null
let startTime = Date.now()
let initialBalance = 0

function formatHashrate(hr) {
    let unit = "H"
    if (hr >= 1000000) {
        hr /= 1000000
        unit = "mH"
    } else if (hr >= 1000) {
        hr /= 1000
        unit = "kH"
    }
    return hr.toFixed(2) + " " + unit + "/s"
}

function sec2hms(sec) {
    let h = Math.floor(sec / 3600)
    let m = Math.floor((sec % 3600) / 60)
    let s = Math.floor(sec % 60)
    return `${h}:${m}:${s}`
}

async function fetchData() {
    const username = document.getElementById("username").value
    if (!username) return

    try {
        const response = await fetch(`https://server.duinocoin.com/v2/users/${username}`)
        const data = await response.json()

        const result = data.result
        const miners = result.miners
        const balance = result.balance.balance
        const verified = result.balance.verified
        const trustScore = result.balance.trust_score
        
		// --- PRETURI DIN API DUINO-COIN ---
		const prices = result.prices || {};

        
		const lastTx = (result.transactions && result.transactions.length > 0) 
			? result.transactions[result.transactions.length - 1] 
			: null;

		let txHTML = "N/A";
		if (lastTx) {
			const isSender = lastTx.sender === username;
			const party = isSender ? `To: ${lastTx.recipient}` : `From: ${lastTx.sender}`;
			const colorClass = isSender ? "red" : "green";
			const sign = isSender ? "-" : "+";
    
			txHTML = `<div class="tx-box">
				<span class="${colorClass}">${sign}${lastTx.amount} DUCO</span><br>
				<small>${party}</small><br>
				<small class="orange">"${lastTx.datetime}"</small>
			</div>`;
		}

		// --- PRET DUCO DIN API (MAX) ---
		const ducoPrice = parseFloat(prices.max || 0);
		const balanceUSD = ducoPrice > 0
			? (balance * ducoPrice).toFixed(6)
			: "0.000000";



        // --- AFISARE PRETURI IN BUSTIERA (TICKER) ---
        let pricesHTML = "";
		for (const [key, val] of Object.entries(prices)) {
			const price = parseFloat(val);
			if (price > 0) {
				pricesHTML += `<div class="price-item-inline">
					${key}: <span>$${price.toFixed(8)}</span>
				</div>`;
			}
		}

        // Repetam continutul pentru a evita spatiul gol mare la finalul animatiei
        document.getElementById("exchange-prices").innerHTML = pricesHTML;

        let totalHash = 0
        let totalAccepted = 0
        let totalSharerate = 0

        const secondsElapsed = (Date.now() - startTime) / 1000
		let daily_average = 0
		if (secondsElapsed > 60) {
			let balanceGained = balance - initialBalance
			daily_average = (balanceGained / secondsElapsed) * 86400
		} else {
			daily_average = result.balance.daily_estimate || 0
		}

        let tableHTML = `<table><tr><th>Device ID</th><th>Software</th><th>Algo</th><th>Success</th><th>Rejected</th><th>Hashrate</th><th>Pool</th><th>Diff</th><th>Ping</th></tr>`

        miners.forEach(m => {
            const hashrate = parseInt(m.hashrate || 0);
            const accepted = parseInt(m.accepted || 0);
            const rejected = parseInt(m.rejected || 0);
            let sharerate = parseInt(m.sharetime || 0);
            if (sharerate < accepted + rejected) sharerate = accepted + rejected;

            totalHash += hashrate;
            totalAccepted += accepted;
            totalSharerate += sharerate;

            tableHTML += `<tr><td class="blue">${m.identifier}</td><td class="orange">${m.software}</td><td>${m.algorithm}</td><td class="green">${accepted}/${sharerate}</td><td class="${rejected > 0 ? 'red' : 'green'}">${rejected}</td><td class="cyan">${formatHashrate(hashrate)}</td><td>${m.pool}</td><td>${m.diff}</td><td class="${parseInt(m.pg||0) <= 40 ? 'green' : 'red'}">${m.pg||0}</td></tr>`
        })
        tableHTML += "</table>"

        if (first) { initialBalance = balance; first = false; }

        document.getElementById("summary").innerHTML = `
        <table>
            <tr><th>Username</th><th>Balance</th><th>Daily Avg</th><th>Miners</th><th>Total Hashrate</th><th>Uptime</th><th>Verified</th><th>Last Transaction</th></tr>
            <tr>
                <td class="purple">${username}</td>
                <td class="green">${balance.toFixed(4)} DUCO<br><small class="yellow">$${balanceUSD}</small></td>
                <td class="green">${daily_average.toFixed(2)} DUCO</td>
                <td>${miners.length}</td>
                <td class="cyan">${formatHashrate(totalHash)}</td>
                <td>${sec2hms(secondsElapsed)}</td>
                <td class="${verified === 'yes' ? 'green' : 'red'}">${verified} (Trust: ${trustScore})</td>
                <td>${txHTML}</td>
            </tr>
        </table>`;

        document.getElementById("miners").innerHTML = tableHTML;
        startCountdown();

    } catch (err) {
        console.error(err);
    }
}

function startCountdown() {
    let seconds = 60; 
    clearInterval(refreshTimer);

    refreshTimer = setInterval(() => {
        const color = seconds <= 5 ? "red" : "green";
        document.getElementById("refresh").innerHTML =
            `<span class="${color}">Refreshing in ${seconds}s...</span>`;

        seconds--;
        if (seconds < 0) {
            clearInterval(refreshTimer);
            fetchData();
        }
    }, 1000);
}

function start() {
    const username = document.getElementById("username").value;
    if (!username) return; // Nu face nimic dacă nu e introdus user-ul

    // Afișează bustiera
    document.querySelector(".ticker-wrap").style.display = "flex";
    
    startTime = Date.now();
    first = true;
    fetchData();
}

</script>
</body>
</html>
